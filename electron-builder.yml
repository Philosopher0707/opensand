# electron-builder configuration for the local macOS and Linux builds.
# Staging: `pnpm stage:desktop` produces dist/stage with real node_modules.
appId: com.opensand.agent
productName: OpenSand
# fpm needs a project URL; the staged scoped package has no homepage/repository.
extraMetadata:
  homepage: https://github.com/Philosopher0707/opensand
# The staged package.json carries the scoped name @opensand/desktop, which
# electron-builder would turn into the unsafe executableName @opensanddesktop.
executableName: OpenSand
electronVersion: 45.2.3

directories:
  app: dist/stage
  output: dist/release

# Symlinked workspace packages are kept as a plain folder; asar cannot hold symlinks.
asar: false

files:
  - "**/*"
  - "!**/*.map"
  - "!src/**"
  - "!test/**"
  - "!tsconfig.json"
  - "!package-lock.json"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
    - zip
  # Local builds are unsigned. Remove this line and add entitlements + a
  # Developer ID identity in CI to sign and notarize.
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSScreenCaptureUsageDescription: OpenSand captures the screen to read visible code windows and recognise text.
  # macOS-only native helpers (Mach-O). Linux ships no extraResources.
  extraResources:
    - from: packages/native-bridge/bin
      to: bin

linux:
  category: Utility
  # macOS helper binaries are Mach-O; ship them only via mac.extraResources.
  files:
    - "!node_modules/@opensand/native-bridge/bin/**"
    - "!**/node_modules/@opensand/native-bridge/bin/**"
  # fpm requires a maintainer; the staged scoped package has neither author nor homepage.
  maintainer: "OpenSand Maintainers <maintainers@opensand.local>"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

# Keep the .deb directly in dist/release with a stable name; the default uses
# the scoped package name (@opensand/desktop) and creates a nested directory.
deb:
  artifactName: "OpenSand_${version}_${arch}.deb"
