name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          set -euo pipefail
          SKIP_INSTALL=1 bash scripts/verify.sh
          bash scripts/test/release-direct-tag.test.sh

  security-gates:
    name: Security gates (audit + secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to full commit SHAs, never to a moving tag.
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Dependency audit
        run: pnpm audit --audit-level=high --prod

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${checksum}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Secret scan (event commits)
        env:
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'push' && 'origin/main' || format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="$GITLEAKS_LOG_OPTS"

  build-and-test-macos:
    name: Build & test (macOS, Node 22)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          set -euo pipefail
          SKIP_INSTALL=1 bash scripts/verify.sh
          bash scripts/test/release-direct-tag.test.sh

  stage-release-macos:
    name: Stage release binaries (macOS)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, security-gates, build-and-test-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Package and checksum
        run: |
          set -euo pipefail
          pnpm package:mac
          cd dist/release
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: opensand-binaries-${{ github.sha }}-mac
          path: dist/release/
          retention-days: 7

  stage-release-linux:
    name: Stage release binaries (Linux)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, security-gates, build-and-test-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Install Linux packaging and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnss3 libxss1 libasound2 libgbm1 \
            libx11-xcb1 libxcb-dri3-0 libdrm2 libatk-bridge2.0-0
      - name: Package, smoke-test and checksum
        run: |
          set -euo pipefail
          pnpm package:linux
          bash scripts/smoke-linux.sh dist/release/*.deb
          cd dist/release
          shasum -a 256 *.AppImage *.deb > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: opensand-binaries-${{ github.sha }}-linux
          path: dist/release/
          retention-days: 7
