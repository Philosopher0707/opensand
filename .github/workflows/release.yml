name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: read

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and download staged macOS artifact
        id: staged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          name="opensand-binaries-${GITHUB_SHA}-mac"
          run_id=$(gh run list --workflow ci.yml --event push --branch main --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId // ""')
          bash scripts/release-check.sh --verify-main-ci "$GITHUB_SHA" refs/remotes/origin/main "$run_id"
          if gh run download "$run_id" --name "$name" --dir dist/release; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using staged artifact $name from CI run $run_id"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No staged macOS artifact for $GITHUB_SHA; compiling release assets on this tag run."
            echo "Fallback compilation required for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.staged.outputs.found != 'true'
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        if: steps.staged.outputs.found != 'true'
        with:
          version: 10
      - if: steps.staged.outputs.found != 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify fallback source build
        if: steps.staged.outputs.found != 'true'
        run: SKIP_INSTALL=1 bash scripts/verify.sh
      - name: Fallback macOS package build
        if: steps.staged.outputs.found != 'true'
        run: pnpm package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      - name: Generate checksums for fallback build
        if: steps.staged.outputs.found != 'true'
        run: (cd dist/release && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)

      - name: Verify macOS artifact integrity and version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          bash scripts/release-check.sh --verify-checksums dist/release mac
          dmg=$(printf '%s\n' dist/release/*.dmg | head -n 1)
          zip=$(printf '%s\n' dist/release/*.zip | head -n 1)
          [[ -f "$dmg" && -f "$zip" ]]
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
          plist="$mount/OpenSand.app/Contents/Info.plist"
          if [[ ! -f "$plist" ]]; then
            plist=$(find "$mount" -maxdepth 4 -type f -path '*/Contents/Info.plist' -print -quit)
          fi
          [[ -f "$plist" ]] || { echo "Info.plist not found in mounted DMG" >&2; exit 1; }
          bash scripts/release-check.sh --verify-info-plist "$version" "$plist"
          hdiutil detach "$mount" -force >/dev/null
          rmdir "$mount"
          bash scripts/provenance-gate.sh
          bash scripts/smoke-packaged.sh "$zip"
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/release/*.dmg
            dist/release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false

  release-linux:
    runs-on: ubuntu-22.04
    needs: release-macos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and download staged Linux artifact
        id: staged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          name="opensand-binaries-${GITHUB_SHA}-linux"
          run_id=$(gh run list --workflow ci.yml --event push --branch main --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId // ""')
          bash scripts/release-check.sh --verify-main-ci "$GITHUB_SHA" refs/remotes/origin/main "$run_id"
          if gh run download "$run_id" --name "$name" --dir dist/release; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using staged artifact $name from CI run $run_id"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No staged Linux artifact for $GITHUB_SHA; compiling release assets on this tag run."
            echo "Fallback compilation required for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.staged.outputs.found != 'true'
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        if: steps.staged.outputs.found != 'true'
        with:
          version: 10
      - if: steps.staged.outputs.found != 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify fallback source build
        if: steps.staged.outputs.found != 'true'
        run: SKIP_INSTALL=1 bash scripts/verify.sh
      - name: Install Linux packaging and smoke dependencies
        if: steps.staged.outputs.found != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnss3 libxss1 libasound2 libgbm1 \
            libx11-xcb1 libxcb-dri3-0 libdrm2 libatk-bridge2.0-0
      - name: Fallback Linux package build
        if: steps.staged.outputs.found != 'true'
        run: pnpm package:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Generate checksums for fallback build
        if: steps.staged.outputs.found != 'true'
        run: (cd dist/release && shasum -a 256 *.AppImage *.deb > SHA256SUMS.txt)

      - name: Verify Linux artifact integrity and smoke
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          bash scripts/release-check.sh --verify-checksums dist/release linux
          deb=$(printf '%s\n' dist/release/*.deb | head -n 1)
          [[ -f "$deb" ]]
          package_version=$(dpkg-deb -f "$deb" Version)
          [[ "$package_version" == "$version" ]] || {
            echo "Linux package version mismatch: $package_version expected $version" >&2; exit 1;
          }
          bash scripts/provenance-gate.sh
          bash scripts/smoke-linux.sh "$deb"
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/release/*.AppImage
            dist/release/*.deb
          generate_release_notes: false
          draft: false
          prerelease: false
